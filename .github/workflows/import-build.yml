name: Import CARVEOUT build
# bootstrap trigger
on:
  push:
    paths:
      - ".github/workflows/import-build.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/carveout.part* | base64 -d > /tmp/carveout.zip
          rm -rf /tmp/import
          mkdir -p /tmp/import
          unzip -q /tmp/carveout.zip -d /tmp/import
          rsync -a --delete --exclude='.git/' /tmp/import/carveout-studionet/ ./
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete CARVEOUT build"
          git push
