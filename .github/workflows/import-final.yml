name: Import final CARVEOUT source
on:
  push:
    paths:
      - ".github/workflows/import-final.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap2/carveout.part* | base64 -d > /tmp/source.zip
          echo "ba7867f96cba42c29dc5ca703a868a1eeae9b849b84da1b1af23863dab1ffa0e  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/import
          mkdir -p /tmp/import
          unzip -q /tmp/source.zip -d /tmp/import
          rsync -a --delete --exclude='.git/' /tmp/import/carveout-studionet/ ./
      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete CARVEOUT source"
          git push
