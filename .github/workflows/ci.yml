name: CARVEOUT CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m py_compile contracts/carveout.py
      - run: genvm-lint check contracts/carveout.py --json
      - run: genvm-lint validate contracts/carveout.py
      - run: genvm-lint schema contracts/carveout.py --output /tmp/carveout.schema.json
      - run: genvm-lint typecheck contracts/carveout.py
      - name: Pin Direct Mode GenVM runner
        run: |
          mkdir -p ~/.cache/gltest-direct
          curl --fail --location --silent --show-error https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz --output ~/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz
          (cd "$HOME/.cache/gltest-direct" && echo "4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2  genvm-universal-v0.2.16.tar.xz" | sha256sum --check)
      - run: python -m pytest tests/direct/ -v
      - run: python -m pytest tests/integration/ -v
      - run: python scripts/check_release.py
      - run: python scripts/check_contract_patterns.py
      - run: python scripts/check_frontend_surface.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run check:deploy
      - run: cd frontend && npm ci && npm test && npm run typecheck && npm run build
