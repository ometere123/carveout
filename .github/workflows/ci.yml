name: CARVEOUT CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/carveout.py --json
      - run: pytest tests/direct/ -v
      - run: python scripts/check_release.py
      - run: python scripts/check_contract_patterns.py
      - run: python scripts/check_frontend_surface.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd frontend && npm install && npm run typecheck && npm run build
